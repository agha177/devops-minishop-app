
services:
  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      POSTGRES_DB: minishop

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 256m

  backend:
    image: minishop-backend:v1
    restart: unless-stopped

    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: minishop
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      DB_NAME: minishop

    depends_on:
      db:
        condition: service_healthy

    mem_limit: 128m

  frontend:
    image: minishop-frontend:v1
    restart: unless-stopped

    ports:
      - "8082:80"

    depends_on:
      - backend

    mem_limit: 64m

volumes:
  postgres-data:
    external: true
    name: minishop-postgres-data

